name: Build check

# Runs on every pull request aimed at main, to catch a broken build BEFORE it is
# merged and published. This workflow only builds the site to confirm it works —
# it never publishes anything. Publishing is handled solely by deploy.yml, which
# runs after a merge to main.
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# If new commits are pushed to a pull request, cancel the older in-progress check
# for that same pull request — only the latest commit needs verifying.
concurrency:
  group: "build-check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
